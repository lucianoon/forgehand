services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: forgehand
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d forgehand"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Memória de projeto persistente (Fase 4) — opcional:
  #   MEMORY_BACKEND=neo4j docker compose --profile neo4j up
  neo4j:
    image: neo4j:5
    profiles: ["neo4j"]
    environment:
      # Sem NEO4J_PASSWORD o container recusa subir com erro claro do próprio
      # Neo4j — não usar :? aqui: quebraria `docker compose config` da CI
      # mesmo com o profile inativo.
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      ENVIRONMENT: dev
      WORKFLOW_QUEUE_BACKEND: postgres
      RUN_EMBEDDED_WORKFLOW_WORKERS: "false"
      CHECKPOINTER_BACKEND: postgres
      DATABASE_URL: postgresql://forge:forge@postgres:5432/forgehand
      MEMORY_BACKEND: ${MEMORY_BACKEND:-memory}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
      API_KEYS_JSON: ${API_KEYS_JSON:?defina API_KEYS_JSON no .env}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      LLM_PROVIDER_BACKEND: ${LLM_PROVIDER_BACKEND:-openrouter}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # PRICING_JSON e TIER_BINDINGS_JSON: descomentar para sobrescrever
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    # A imagem compartilha o healthcheck HTTP da API, mas o worker não serve
    # HTTP. A saúde dele é refletida pela fila/readiness da API.
    healthcheck:
      disable: true
    environment:
      ENVIRONMENT: dev
      WORKFLOW_QUEUE_BACKEND: postgres
      RUN_EMBEDDED_WORKFLOW_WORKERS: "true"
      CHECKPOINTER_BACKEND: postgres
      DATABASE_URL: postgresql://forge:forge@postgres:5432/forgehand
      MEMORY_BACKEND: ${MEMORY_BACKEND:-memory}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
      API_KEYS_JSON: ${API_KEYS_JSON:?defina API_KEYS_JSON no .env}
      LLM_PROVIDER_BACKEND: ${LLM_PROVIDER_BACKEND:-openrouter}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  neo4jdata:
