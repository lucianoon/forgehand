name: Benchmark

permissions:
  contents: read

# Job barato em push para main: valida cases.json e dá status ao badge do README.
# O job pago (LLM via OpenRouter) só roda em workflow_dispatch e só se o secret
# OPENROUTER_API_KEY existir; sem a chave o job termina sem gastar nada.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      case_ids:
        description: >-
          IDs de casos separados por vírgula (ex.: architecture-review,security-review).
          Vazio executa todos os casos de benchmarks/cases.json.
        required: false
        default: ""
        type: string
      concurrency:
        description: "Workflows de benchmark executados em paralelo"
        required: false
        default: "2"
        type: string
      fail_on_gate:
        description: "Falhar o job se o quality gate reprovar"
        required: false
        default: true
        type: boolean

jobs:
  cases:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Validate benchmark cases
        run: |
          python <<'PY'
          import json, pathlib
          path = pathlib.Path("benchmarks/cases.json")
          data = json.loads(path.read_text())
          assert isinstance(data, list) and data, "cases.json vazio"
          for case in data:
              assert case.get("id"), "caso sem id"
              assert case.get("request"), "caso sem request"
          print(f"{len(data)} casos validos")
          PY

  benchmark:
    if: github.event_name == 'workflow_dispatch'
    needs: cases
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check OPENROUTER_API_KEY secret
        id: key
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "OPENROUTER_API_KEY ausente: benchmark pago pulado (sem gasto)."
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.key.outputs.has_key == 'true'

      - uses: astral-sh/setup-uv@v7
        if: steps.key.outputs.has_key == 'true'
        with:
          python-version: "3.12"
          enable-cache: true

      - run: uv sync --extra dev --extra postgres --extra neo4j --extra otel --locked
        if: steps.key.outputs.has_key == 'true'

      - name: Run benchmark (in-process)
        if: steps.key.outputs.has_key == 'true'
        env:
          LLM_PROVIDER_BACKEND: openrouter
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          API_KEYS_JSON: '{"ci-benchmark":{"client_id":"ci","projects":["*"],"role":"admin"}}'
          FORGEHAND_API_KEY: ci-benchmark
          CASE_IDS: ${{ inputs.case_ids }}
          BENCH_CONCURRENCY: ${{ inputs.concurrency }}
          FAIL_ON_GATE: ${{ inputs.fail_on_gate }}
        run: |
          args=()
          if [ -n "$CASE_IDS" ]; then
            IFS=',' read -ra ids <<< "$CASE_IDS"
            for id in "${ids[@]}"; do
              trimmed="$(echo "$id" | xargs)"
              [ -n "$trimmed" ] && args+=(--case-id "$trimmed")
            done
          fi
          if [ "$FAIL_ON_GATE" = "true" ]; then
            args+=(--fail-on-gate)
          fi
          uv run python -m app.evaluation.benchmark \
            --in-process \
            --cases benchmarks/cases.json \
            --concurrency "$BENCH_CONCURRENCY" \
            --output reports/benchmark.json \
            "${args[@]}"

      - name: Upload benchmark reports
        if: always() && steps.key.outputs.has_key == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-reports
          path: reports/
          retention-days: 90
          if-no-files-found: warn
