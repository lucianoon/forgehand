name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
          POSTGRES_DB: forgehand
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forge -d forgehand"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/ci-password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --extra postgres --extra neo4j --extra otel --extra github-app --locked
      - run: uv run ruff check .
      - run: uv run mypy app
      - run: node --check app/web/app.js
      - run: node --test tests/web/*.test.cjs
      - run: docker compose config --quiet
        env:
          API_KEYS_JSON: '{"ci-key":{"client_id":"ci","projects":["*"],"role":"admin"}}'
          OPENROUTER_API_KEY: ci-placeholder
      - run: uv run pytest -q
        env:
          RUN_POSTGRES_TESTS: "1"
          TEST_DATABASE_URL: postgresql://forge:forge@localhost:5432/forgehand
          PRODUCT_TEST_POSTGRES_URL: postgresql://forge:forge@localhost:5432/forgehand
          RUN_NEO4J_TESTS: "1"
          NEO4J_URI: bolt://localhost:7687
          NEO4J_PASSWORD: ci-password
      - run: docker build --tag forgehand:ci .

  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --locked
      - name: Pull pinned sandbox images
        run: |
          docker pull python@sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea
          docker pull node@sha256:83f487e0a63425e5b4d146fb5e5be574bcbe1b7b843d3ebafdd95eaf7767a7e5
      - name: Verify sandbox and independent acceptance controls
        run: uv run pytest tests/integration/test_factory_sandbox_docker.py -q
        env:
          RUN_FACTORY_DOCKER_TESTS: "1"
          FACTORY_DOCKER_PYTHON_TEST_IMAGE: python@sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea
          FACTORY_DOCKER_NODE_TEST_IMAGE: node@sha256:83f487e0a63425e5b4d146fb5e5be574bcbe1b7b843d3ebafdd95eaf7767a7e5
