name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
          POSTGRES_DB: forgehand
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forge -d forgehand"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/ci-password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --extra postgres --extra neo4j --extra otel --locked
      - run: uv run ruff check .
      - run: uv run mypy app
      # Audita o conjunto TRAVADO, com todos os extras — inclusive os que este
      # job não instala. Reprova o build em vulnerabilidade conhecida: as
      # atualizações automáticas do Dependabot estão desligadas, então sem um
      # gate aqui o alerta fica só no painel.
      # Para tolerar um achado sem correção disponível:
      #   uvx pip-audit -r requirements.txt --ignore-vuln <ID>
      - name: Auditar dependências
        run: |
          uv export --frozen --all-extras --no-emit-project --no-hashes \
            -o requirements.txt
          uvx pip-audit -r requirements.txt --progress-spinner off
      - run: node --check app/web/app.js
      - run: docker compose config --quiet
        env:
          API_KEYS_JSON: '{"ci-key":{"client_id":"ci","projects":["*"],"role":"admin"}}'
          OPENROUTER_API_KEY: ci-placeholder
      - run: uv run pytest -q
        env:
          RUN_POSTGRES_TESTS: "1"
          RUN_NEO4J_TESTS: "1"
          NEO4J_URI: bolt://localhost:7687
          NEO4J_PASSWORD: ci-password
      - run: docker build --tag forgehand:ci .
