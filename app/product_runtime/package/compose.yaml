services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: product
      POSTGRES_DB: product
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina uma senha forte em .env}
    volumes:
      - product-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product -d product"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:?Defina a URL PostgreSQL em .env}
      APP_ORIGIN: ${APP_ORIGIN:?Defina a origem exata}
      APP_ENV: ${APP_ENV:-production}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
volumes:
  product-data:
